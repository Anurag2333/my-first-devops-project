name: My First CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-website:
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Check website file
        run: test -f index.html

      - name: Confirm pipeline success
        run: echo "Website check passed!"